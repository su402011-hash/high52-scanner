name: 52week-high-scan

on:
  schedule:
    # UTC表記。16:00 JST(日本株引け後) と 07:00 JST(米国株引け後) の平日2回
    - cron: '0 7 * * 1-5'
    - cron: '0 22 * * 1-5'
  workflow_dispatch:   # スマホから手動実行するためのボタン

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        run: python high52_scanner.py scan

      - name: Update ranking
        run: python high52_scanner.py rank || true

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add outputs/
          git diff --cached --quiet || git commit -m "scan $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
