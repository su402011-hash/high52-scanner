name: value-growth-scan

on:
  schedule:
    # 毎週土曜 9:00 JST (市場が閉まった週末にじっくり実行)
    - cron: '0 0 * * 6'
  workflow_dispatch:   # 手動実行ボタン

permissions:
  contents: write

concurrency:
  group: high52-scan
  cancel-in-progress: false

jobs:
  value-growth:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run value scan
        run: python high52_scanner.py value_scan

      - name: Run growth scan
        run: python high52_scanner.py growth_scan
      - name: Run US growth scan
        run: python high52_scanner.py us_growth_scan
      - name: Run setup scan
        run: python high52_scanner.py setup_scan



      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          ls -t outputs/value_*.csv | head -1 | xargs -I{} cp {} outputs/latest_value.csv || true
          ls -t outputs/growth_*.csv | head -1 | xargs -I{} cp {} outputs/latest_growth.csv || true
          ls -t outputs/us_growth_*.csv | head -1 | xargs -I{} cp {} outputs/latest_us_growth.csv || true
          git add outputs/
          ls -t outputs/setup_*.csv | head -1 | xargs -I{} cp {} outputs/latest_setup.csv || true
          git diff --cached --quiet || git commit -m "value/growth scan $(date -u +'%Y-%m-%d')"
          git pull --rebase origin main
          git push
